[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-level-knowledge-transfer"
version = "0.2.0"
description = "Temporal and cross-domain emotion intensity forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
neural = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.34",
  "tqdm>=4.66",
]
augmentation = [
  "huggingface-hub>=0.27",
  "llama-cpp-python>=0.3",
  "tqdm>=4.66",
]
analysis = ["statsmodels>=0.14", "matplotlib>=3.8"]
all = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.34",
  "llama-cpp-python>=0.3",
  "huggingface-hub>=0.27",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]

[project.scripts]
mlkt = "mlkt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
